name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  check: 
    name: Style checking
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'adopt'
    
    - name: Setup Python 3.8
      uses: actions/setup-python@v6
      with:
          python-version: 3.8
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip PyGithub

    - name: Run python joke
      run: python -c "from github import Github; g = Github('${{ secrets.AC_TOKEN }}'); repo = g.get_repo('rejchev/steamid'); print(repo.get_contributors())"

    - name: Run mvn check
      run: mvn -B clean checkstyle:check

  build:
    name: Building
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'adopt'

    - name: Package with Maven
      run: mvn -B clean package -DskipTests

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-latest
        path: ./target
        retention-days: 1

  tests:
    name: Testing
    runs-on: ubuntu-latest
    needs: 
      - check
      - build
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'adopt'

    - name: Run tests
      run: mvn -B clean test

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: 
      - check
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'ubuntu-latest/*.jar'
          tag: ${{ github.ref }}
          file_glob: true